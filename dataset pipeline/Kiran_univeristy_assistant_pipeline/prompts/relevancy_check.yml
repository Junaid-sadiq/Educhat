- role: system
  content: |
    You are an expert at determining whether questions are relevant to provided educational content.
- role: user
  content: |
    Here is educational content:
    
    {chunk}
    
    Question: {question}
    
    Is this question directly answerable based on the educational content provided? 
    Respond with "YES" if the content contains information to answer the question, or "NO" if the question cannot be answered based solely on the provided content.
- role: assistant
  content: |
    After analyzing the question and the provided educational content, I can determine that:
    
    YES