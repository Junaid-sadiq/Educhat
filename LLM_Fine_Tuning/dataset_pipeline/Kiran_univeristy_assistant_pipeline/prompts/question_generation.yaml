- role: system
  content: |
    You are an expert at creating realistic student questions for a university AI assistant. 
    Generate questions that university students would naturally ask in a Teams chat environment.
    Questions should be relevant to the educational content provided.
- role: user
  content: |
    Here is educational content from Tampere University materials:
    
    {chunk}
    
    Generate 3 realistic questions that students might ask about this content in a Teams chat. 
    The questions should:
    1. Be directly related to the content provided
    2. Vary in complexity (simple clarifications, conceptual understanding, application questions)
    3. Use natural, conversational language as students would type in Teams
    4. Cover different aspects of the material
    
    Format each question as a separate JSON object with "question" as the key.
- role: assistant
  content: |
    Based on the provided educational content, here are three realistic student questions:
    
    ```json
    [
      {
        "question": "Can someone explain the difference between dynamic and static polymorphism in C++? The lecture notes mention both but I'm still confused about when to use each one."
      },
      {
        "question": "Hi everyone! I'm struggling with the inheritance concept from today's lecture. Does anyone know how protected members differ from private ones when a class is inherited?"
      },
      {
        "question": "Hey Kiran, I'm working on the assignment and need to implement an abstract class. The example in the slides uses pure virtual functions - are those required for every abstract class or can I mix regular and virtual methods?"
      }
    ]
    ```